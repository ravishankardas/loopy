name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # llama-cpp-python only ships source builds on PyPI; use the prebuilt CPU wheels.
  PIP_EXTRA_INDEX_URL: https://abetlen.github.io/llama-cpp-python/whl/cpu
  PIP_PREFER_BINARY: "1"
  QT_QPA_PLATFORM: offscreen   # no screen on CI: Qt draws into memory
  PYTHONUTF8: "1"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests --output-format github
      - name: Mypy
        run: mypy

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
        include:
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # PortAudio for sounddevice; PulseAudio because PortAudio connects to a
          # sound server as soon as sounddevice is imported; the rest is what Qt
          # needs to start without a screen.
          sudo apt-get install -y --no-install-recommends \
            libportaudio2 pulseaudio libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Silent sound server (Linux)
        if: runner.os == 'Linux'
        # No sound card on CI: a PulseAudio server with a "null" sink (audio goes nowhere).
        run: |
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=dummy
          pactl info | grep -i "server name"
      - name: Install
        run: pip install -e .
      - name: Run tests
        # The real-model conversation tests are opt-in (LOOPY_MODEL_TESTS=1):
        # they need the 2 GB Llama model, which CI doesn't download.
        run: python -m unittest discover tests -v
