<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Helvetica, Arial, sans-serif">
  <title>How Loopy works</title>

  <rect width="1000" height="500" fill="#ffffff"/>

  <text x="40" y="38" font-size="20" font-weight="bold" fill="#111">How Loopy works</text>
  <text x="960" y="38" font-size="13" fill="#555" text-anchor="end">everything runs locally, on the CPU</text>

  <g fill="#ffffff" stroke="#111" stroke-width="1.6">
    <!-- row 1: hearing -->
    <rect x="40"  y="70" width="150" height="70" rx="8"/>
    <rect x="230" y="70" width="150" height="70" rx="8"/>
    <rect x="420" y="70" width="150" height="70" rx="8"/>
    <rect x="610" y="70" width="150" height="70" rx="8"/>
    <!-- row 2: thinking and speaking -->
    <rect x="40"  y="230" width="150" height="70" rx="8"/>
    <rect x="230" y="230" width="150" height="70" rx="8"/>
    <rect x="420" y="230" width="150" height="70" rx="8" stroke-width="3"/>
    <rect x="610" y="230" width="150" height="70" rx="8"/>
    <rect x="800" y="230" width="150" height="70" rx="8" stroke-dasharray="6 4"/>
    <!-- row 3: what the gate allows -->
    <rect x="40"  y="400" width="150" height="70" rx="8"/>
    <rect x="230" y="400" width="150" height="70" rx="8"/>
    <rect x="420" y="400" width="150" height="70" rx="8"/>
    <rect x="610" y="400" width="150" height="70" rx="8"/>
  </g>

  <g font-size="15" font-weight="bold" fill="#111" text-anchor="middle">
    <text x="115" y="101">Microphone</text>
    <text x="305" y="101">Voice detection</text>
    <text x="495" y="101">Speech to text</text>
    <text x="685" y="101">Wake word</text>

    <text x="115" y="261">Speakers</text>
    <text x="305" y="261">Voice</text>
    <text x="495" y="261">Tag gate</text>
    <text x="685" y="261">Llama 3.2 3B</text>
    <text x="875" y="261">Saved warm-up</text>

    <text x="115" y="431">Knock detector</text>
    <text x="305" y="431">Actions</text>
    <text x="495" y="431">Lookups</text>
    <text x="685" y="431">Games</text>
  </g>

  <g font-size="12.5" fill="#444" text-anchor="middle">
    <text x="115" y="121">always on</text>
    <text x="305" y="121">Silero VAD</text>
    <text x="495" y="121">faster-whisper</text>
    <text x="685" y="121">"Hey Loopy"</text>

    <text x="115" y="281">live, while it writes</text>
    <text x="305" y="281">Piper, streaming</text>
    <text x="495" y="281">code decides what runs</text>
    <text x="685" y="281">llama.cpp, Q4</text>
    <text x="875" y="281">loads in ~5 s</text>

    <text x="115" y="451">plays "ho yeah!"</text>
    <text x="305" y="451">open / close apps</text>
    <text x="495" y="451">read-only facts</text>
    <text x="685" y="451">tic-tac-toe, snake</text>
  </g>

  <g stroke="#111" stroke-width="1.6" fill="none">
    <!-- row 1, left to right -->
    <line x1="190" y1="105" x2="228" y2="105"/>
    <line x1="380" y1="105" x2="418" y2="105"/>
    <line x1="570" y1="105" x2="608" y2="105"/>
    <!-- wake word down to the model -->
    <line x1="685" y1="140" x2="685" y2="228"/>
    <!-- row 2, right to left -->
    <line x1="610" y1="265" x2="572" y2="265"/>
    <line x1="420" y1="265" x2="382" y2="265"/>
    <line x1="230" y1="265" x2="192" y2="265"/>
    <!-- saved warm-up into the model -->
    <line x1="800" y1="265" x2="762" y2="265" stroke-dasharray="6 4"/>
    <!-- gate branches -->
    <line x1="305" y1="350" x2="305" y2="398"/>
    <line x1="495" y1="350" x2="495" y2="398"/>
    <line x1="685" y1="350" x2="685" y2="398"/>
    <!-- microphone around to the knock detector -->
    <polyline points="40,105 20,105 20,435 38,435"/>
    <!-- knock clip up to the speakers -->
    <line x1="115" y1="400" x2="115" y2="302"/>
  </g>
  <!-- gate branch trunk (no arrowheads) -->
  <g stroke="#111" stroke-width="1.6" fill="none">
    <line x1="495" y1="300" x2="495" y2="350"/>
    <line x1="305" y1="350" x2="685" y2="350"/>
  </g>

  <g fill="#111" stroke="none">
    <polygon points="221,100 230,105 221,110"/>
    <polygon points="411,100 420,105 411,110"/>
    <polygon points="601,100 610,105 601,110"/>
    <polygon points="680,221 685,230 690,221"/>
    <polygon points="579,260 570,265 579,270"/>
    <polygon points="389,260 380,265 389,270"/>
    <polygon points="199,260 190,265 199,270"/>
    <polygon points="769,260 760,265 769,270"/>
    <polygon points="300,391 305,400 310,391"/>
    <polygon points="490,391 495,400 500,391"/>
    <polygon points="680,391 685,400 690,391"/>
    <polygon points="31,430 40,435 31,440"/>
    <polygon points="110,309 115,300 120,309"/>
  </g>

  <g font-size="12.5" fill="#111">
    <text x="695" y="190">your words</text>
    <text x="580" y="255" font-size="11.5">reply</text>
    <text x="311" y="381">[do], only after a "yes"</text>
    <text x="501" y="381">[check]</text>
    <text x="691" y="381">[game] [move] [play]</text>
    <text x="123" y="355">clip</text>
  </g>
</svg>
